name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  deploy:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@master

      - name: Check Minikube Cluster
        run: |
          minikube status
          kubectl get pods -A

      - name: Create Namespace
        run: kubectl create namespace ananasiika 

      - name: Deploy DB and services
        run: |
          kubectl get namespace
          
          cd k8s
          helm delete postgres --namespace ananasiika --ignore-not-found
          helm install -n ananasiika postgres ./postgres
          
          helm delete services --namespace ananasiika --ignore-not-found
          helm install -n ananasiika services ./services

      - name: Enable Ingress in Minikube
        run: |
          minikube addons enable ingress
          
          # Ждем готовности Ingress Controller
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      - name: Wait for Ingress Webhook
        run: |
          # Ждем готовности admission webhook
          echo "Waiting for ingress admission webhook..."
          until kubectl get svc -n ingress-nginx ingress-nginx-controller-admission 2>/dev/null; do
            echo "Waiting for admission service..."
            sleep 5
          done
          
          # Проверяем что порт доступен
          until kubectl exec -n ingress-nginx deployment/ingress-nginx-controller -- \
            netstat -tuln | grep -q 443; do
            echo "Waiting for admission webhook port..."
            sleep 5
          done
          
          sleep 10

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      - name: Setup Minikube Tunnel and Get IP
        run: |
          # Запускаем tunnel в фоне
          minikube tunnel &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          # Ждем запуска tunnel
          sleep 30
          
          # Получаем IP Minikube
          MINIKUBE_IP=$(minikube ip)
          echo "MINIKUBE_IP=$MINIKUBE_IP" >> $GITHUB_ENV
          echo "Minikube IP: $MINIKUBE_IP"
          
          # Проверяем Ingress
          kubectl get ingress -n ananasiika -o wide

      - name: Wait for Services
        uses: jakejarvis/wait-action@master
        with:
          time: '60s'
      - name: Create PostgreSQL Service
        run: |
          echo "🔧 Creating PostgreSQL service..."
          
          # Создаем сервис для PostgreSQL
          kubectl expose deployment postgres -n ananasiika \
            --port=5432 \
            --target-port=5432 \
            --name=postgres
          
          echo "✅ PostgreSQL service created"
          
          # Ждем создания сервиса
          sleep 5
          
          # Проверяем сервис
          echo "=== PostgreSQL Service ==="
          kubectl get svc -n ananasiika postgres -o wide
          
          # Получаем IP сервиса
          POSTGRES_IP=$(kubectl get svc -n ananasiika postgres -o jsonpath='{.spec.clusterIP}')
          echo "PostgreSQL ClusterIP: $POSTGRES_IP"

      - name: Initialize Databases
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          kubectl wait --namespace ananasiika --for=condition=ready pod -l app=postgres --timeout=300s
          
          echo "Initialize databases and schemas..."
          # Execute initialization scripts in order
          for script in 00-init-user.sql 01-create-databases.sql 02-tickets-schema.sql 03-flights-schema.sql 04-privileges-schema.sql; do
            echo "Executing $script..."
            kubectl exec -n ananasiika deployment/postgres -- \
              psql -U postgres -f /docker-entrypoint-initdb.d/$script
          done
    
          echo "Database initialization completed"
      
      - name: Check database
        run: |
          echo "📊 1. List of all databases:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U postgres -l
          
          echo ""
          echo "🔍 2. Detailed info for each database:"
          
          # Проверяем tickets базу
          echo "--- TICKETS DATABASE ---"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d tickets -c "\dt" 2>/dev/null || echo "Cannot access tickets database"
          
          echo "Tables content:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d tickets -c "SELECT * FROM ticket;" 2>/dev/null || echo "No data in ticket table"
          
          # Проверяем flights базу  
          echo ""
          echo "--- FLIGHTS DATABASE ---"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d flights -c "\dt" 2>/dev/null || echo "Cannot access flights database"
          
          echo "Airports:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d flights -c "SELECT * FROM airport;" 2>/dev/null || echo "No data in airport table"
          
          echo "Flights:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d flights -c "SELECT * FROM flight;" 2>/dev/null || echo "No data in flight table"
          
          # Проверяем privileges базу
          echo ""
          echo "--- PRIVILEGES DATABASE ---"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d privileges -c "\dt" 2>/dev/null || echo "Cannot access privileges database"
          
          echo "Privileges:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d privileges -c "SELECT * FROM privilege;" 2>/dev/null || echo "No data in privilege table"
          
          echo "Privilege history:"
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d privileges -c "SELECT * FROM privilege_history;" 2>/dev/null || echo "No data in privilege_history table"

      - name: Debug Resources
        run: |
          echo "=== All resources in namespace ananasiika ==="
          kubectl get all -n ananasiika
          
          echo "=== Ingress details ==="
          kubectl describe ingress gateway-ingress -n ananasiika
          
          echo "=== Services ==="
          kubectl get svc -n ananasiika
          
          echo "=== Pods status ==="
          kubectl get pods -n ananasiika -o wide
          
          echo "=== Ingress Controller logs ==="
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --tail=20

          kubectl get endpoints -n ananasiika
          kubectl describe svc -n ananasiika
          kubectl get pods -n ananasiika -o wide

      - name: Test DNS Resolution
        run: |
          echo "=== Testing connectivity with full DNS names ==="
          
          # Сначала получим точный namespace
          NAMESPACE=$(kubectl config view --minify -o jsonpath='{..namespace}')
          echo "Using namespace: $NAMESPACE"
          
          kubectl run -n ananasiika test-full-dns --image=curlimages/curl --rm -i --restart=Never --command -- \
            sh -c '
              echo "Testing flights with full DNS name..."
              curl -v http://flights.ananasiika.svc.cluster.local:8060/manage/health || echo "Flights failed"
              
              echo "Testing bonus with full DNS name..."
              curl -v http://bonus.ananasiika.svc.cluster.local:8050/manage/health || echo "Bonus failed"
              
              echo "Testing tickets with full DNS name..."
              curl -v http://tickets.ananasiika.svc.cluster.local:8070/manage/health || echo "Tickets failed"
            '

      - name: Check PostgreSQL Readiness
        run: |
          echo "🔍 Checking PostgreSQL readiness..."
          
          # Проверяем что PostgreSQL слушает порт
          kubectl exec -n ananasiika deployment/postgres -- netstat -tuln | grep 5432 && \
          echo "✅ PostgreSQL is listening on port 5432" || \
          echo "❌ PostgreSQL is not listening on port 5432"
          
          # Проверяем подключение изнутри PostgreSQL контейнера
          kubectl exec -n ananasiika deployment/postgres -- pg_isready -U postgres && \
          echo "✅ PostgreSQL is ready to accept connections" || \
          echo "❌ PostgreSQL is not ready"
          
          # Проверяем базы данных
          echo "📊 Available databases:"
          kubectl exec -n ananasiika deployment/postgres -- psql -U postgres -c "\l" | grep -E "(tickets|flights|privileges)" || \
          echo "No application databases found"

      - name: Find PostgreSQL Addresses
        run: |
          echo "🔍 Finding PostgreSQL connection details..."
          
          # ClusterIP сервиса PostgreSQL
          echo "=== PostgreSQL Service ==="
          kubectl get svc -n ananasiika postgres -o wide
          
          # IP сервиса
          POSTGRES_CLUSTER_IP=$(kubectl get svc -n ananasiika postgres -o jsonpath='{.spec.clusterIP}')
          echo "PostgreSQL ClusterIP: $POSTGRES_CLUSTER_IP"
          
          # IP пода PostgreSQL
          echo ""
          echo "=== PostgreSQL Pod ==="
          kubectl get pods -n ananasiika -l app=postgres -o wide
          
          POSTGRES_POD_IP=$(kubectl get pods -n ananasiika -l app=postgres -o jsonpath='{.items[0].status.podIP}')
          echo "PostgreSQL PodIP: $POSTGRES_POD_IP"
          
          # Endpoints
          echo ""
          echo "=== PostgreSQL Endpoints ==="
          kubectl get endpoints -n ananasiika postgres
          
          # Подробная информация о сервисе
          echo ""
          echo "=== PostgreSQL Service Details ==="
          kubectl describe svc -n ananasiika postgres

      - name: Test Direct IP Connectivity
        run: |
          echo "🔍 Testing direct IP connectivity to PostgreSQL..."
          
          # Получаем IP адреса
          POSTGRES_CLUSTER_IP=$(kubectl get svc -n ananasiika postgres -o jsonpath='{.spec.clusterIP}')
          POSTGRES_POD_IP=$(kubectl get pods -n ananasiika -l app=postgres -o jsonpath='{.items[0].status.podIP}')
          
          echo "PostgreSQL ClusterIP: $POSTGRES_CLUSTER_IP"
          echo "PostgreSQL PodIP: $POSTGRES_POD_IP"
          
          # Тестируем подключение изнутри пода
          echo ""
          echo "--- Testing from inside PostgreSQL pod ---"
          kubectl exec -n ananasiika deployment/postgres -- pg_isready -U postgres -h 127.0.0.1 && echo "✅ Localhost connection OK"
          kubectl exec -n ananasiika deployment/postgres -- pg_isready -U postgres -h $POSTGRES_POD_IP && echo "✅ PodIP connection OK"
          
          # Тестируем из других подов
          for pod in $(kubectl get pods -n ananasiika -o jsonpath='{.items[*].metadata.name}'); do
            if [[ $pod != *"postgres"* ]]; then
              echo ""
              echo "--- Testing from $pod ---"
              
              # Простой тест доступности порта
              kubectl exec -n ananasiika $pod -- sh -c "
                echo 'Testing ClusterIP $POSTGRES_CLUSTER_IP:5432...'
                timeout 5 bash -c 'echo > /dev/tcp/$POSTGRES_CLUSTER_IP/5432' 2>/dev/null && echo '✅ ClusterIP:5432 reachable' || echo '❌ ClusterIP:5432 not reachable'
                
                echo 'Testing PodIP $POSTGRES_POD_IP:5432...'  
                timeout 5 bash -c 'echo > /dev/tcp/$POSTGRES_POD_IP/5432' 2>/dev/null && echo '✅ PodIP:5432 reachable' || echo '❌ PodIP:5432 not reachable'
              " || echo "Cannot test connectivity from $pod"
            fi
          done

      - name: Test External Access (для Postman - используйте этот)
        run: |
          # Эти должны работать для Postman тестов
          echo "Testing external access:"
          curl http://192.168.49.2:30000/manage/health
          curl http://192.168.49.2:30000/api/v1/flights
            
      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Check Logs
        if: always()
        run: |
          echo "=== Getting logs from ALL services ==="
          
          # Получаем все поды в неймспейсе
          kubectl get pods -n ananasiika -o wide
          
          echo "================================================================================"
          echo "=== LOGS USING SERVICE LABEL ==="
          echo "================================================================================"
          
          SERVICES="gateway flights bonus tickets"
          
          for service in $SERVICES; do
            echo "--- Service: $service ---"
            kubectl logs -n ananasiika -l service="$service" --prefix=true --tail=100 2>/dev/null || \
            echo "No logs found for service: $service"
            echo ""
          done
          
          # Логи postgres отдельно
          echo "--- Service: postgres ---"
          kubectl logs -n ananasiika -l app=postgres --prefix=true --tail=100 2>/dev/null || \
          echo "No logs found for postgres"
          echo ""
          
          echo "=== Getting logs from ALL services ==="
          
          # Получаем логи для каждого пода по имени
          for pod in $(kubectl get pods -n ananasiika -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Pod: $pod ---"
            kubectl logs -n ananasiika $pod --tail=100 --prefix=true
            echo ""
          done

      - name: Cleanup Tunnel
        if: always()
        run: |
          if [ ! -z "$TUNNEL_PID" ]; then
            kill $TUNNEL_PID 2>/dev/null || true
          fi

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true