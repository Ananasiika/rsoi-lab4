name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  deploy:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@master

      - name: Check Minikube Cluster
        run: |
          minikube status
          kubectl get pods -A

      - name: Create Namespace
        run: kubectl create namespace ananasiika 

      - name: Deploy DB and services
        run: |
          kubectl get namespace
          
          cd k8s
          helm delete postgres --namespace ananasiika --ignore-not-found
          helm install -n ananasiika postgres ./postgres
          
          helm delete services --namespace ananasiika --ignore-not-found
          helm install -n ananasiika services ./services

      - name: Create Missing Databases Immediately
        run: |
          echo "=== Creating missing databases manually ==="
          
          # Создаем flights базу
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U postgres -c "CREATE DATABASE flights; GRANT ALL PRIVILEGES ON DATABASE flights TO program;"
          
          # Создаем privileges базу
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U postgres -c "CREATE DATABASE privileges; GRANT ALL PRIVILEGES ON DATABASE privileges TO program;"
          
          # Создаем таблицы в flights
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d flights -c "
              CREATE TABLE airport
              (
                  id      SERIAL PRIMARY KEY,
                  name    VARCHAR(255),
                  city    VARCHAR(255),
                  country VARCHAR(255)
              );
              
              CREATE TABLE flight
              (
                  id              SERIAL PRIMARY KEY,
                  flight_number   VARCHAR(20)              NOT NULL,
                  datetime        TIMESTAMP WITH TIME ZONE NOT NULL,
                  from_airport_id INT REFERENCES airport (id),
                  to_airport_id   INT REFERENCES airport (id),
                  price           INT                      NOT NULL
              );
              
              INSERT INTO public.airport(id, name, city, country) VALUES 
              (1, 'Шереметьево', 'Москва', 'Россия'),
              (2, 'Пулково', 'Санкт-Петербург', 'Россия');
              
              INSERT INTO public.flight(
                  id, flight_number, datetime, from_airport_id, to_airport_id, price)
                  VALUES (1, 'AFL031', '2021-10-08 20:00', 2, 1, 1500);
            "
          
          # Создаем таблицы в privileges
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U program -d privileges -c "
              CREATE TABLE privilege
              (
                  id       SERIAL PRIMARY KEY,
                  username VARCHAR(80) NOT NULL UNIQUE,
                  status   VARCHAR(80) NOT NULL DEFAULT 'BRONZE'
                      CHECK (status IN ('BRONZE', 'SILVER', 'GOLD')),
                  balance  INT
              );
              
              CREATE TABLE privilege_history
              (
                  id             SERIAL PRIMARY KEY,
                  privilege_id   INT REFERENCES privilege (id),
                  ticket_uid     uuid        NOT NULL,
                  datetime       TIMESTAMP   NOT NULL,
                  balance_diff   INT         NOT NULL,
                  operation_type VARCHAR(20) NOT NULL
                      CHECK (operation_type IN ('FILL_IN_BALANCE', 'DEBIT_THE_ACCOUNT'))
              );
            "
          
          # Финальная проверка
          echo "=== Final database list ==="
          kubectl exec -n ananasiika deployment/postgres -- \
            psql -U postgres -l

      - name: Enable Ingress in Minikube
        run: |
          minikube addons enable ingress
          
          # Ждем готовности Ingress Controller
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      - name: Wait for Ingress Webhook
        run: |
          # Ждем готовности admission webhook
          echo "Waiting for ingress admission webhook..."
          until kubectl get svc -n ingress-nginx ingress-nginx-controller-admission 2>/dev/null; do
            echo "Waiting for admission service..."
            sleep 5
          done
          
          # Проверяем что порт доступен
          until kubectl exec -n ingress-nginx deployment/ingress-nginx-controller -- \
            netstat -tuln | grep -q 443; do
            echo "Waiting for admission webhook port..."
            sleep 5
          done
          
          sleep 10

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      - name: Setup Minikube Tunnel and Get IP
        run: |
          # Запускаем tunnel в фоне
          minikube tunnel &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          # Ждем запуска tunnel
          sleep 30
          
          # Получаем IP Minikube
          MINIKUBE_IP=$(minikube ip)
          echo "MINIKUBE_IP=$MINIKUBE_IP" >> $GITHUB_ENV
          echo "Minikube IP: $MINIKUBE_IP"
          
          # Проверяем Ingress
          kubectl get ingress -n ananasiika -o wide

      - name: Wait for Services
        uses: jakejarvis/wait-action@master
        with:
          time: '60s'

      - name: Debug Resources
        run: |
          echo "=== All resources in namespace ananasiika ==="
          kubectl get all -n ananasiika
          
          echo "=== Ingress details ==="
          kubectl describe ingress gateway-ingress -n ananasiika
          
          echo "=== Services ==="
          kubectl get svc -n ananasiika
          
          echo "=== Pods status ==="
          kubectl get pods -n ananasiika -o wide
          
          echo "=== Ingress Controller logs ==="
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --tail=20

          kubectl get endpoints -n ananasiika
          kubectl describe svc -n ananasiika
          kubectl get pods -n ananasiika -o wide

      - name: Test DNS Resolution
        run: |
          echo "=== Testing connectivity with full DNS names ==="
          
          # Сначала получим точный namespace
          NAMESPACE=$(kubectl config view --minify -o jsonpath='{..namespace}')
          echo "Using namespace: $NAMESPACE"
          
          kubectl run -n ananasiika test-full-dns --image=curlimages/curl --rm -i --restart=Never --command -- \
            sh -c '
              echo "Testing flights with full DNS name..."
              curl -v http://flights.ananasiika.svc.cluster.local:8060/manage/health || echo "Flights failed"
              
              echo "Testing bonus with full DNS name..."
              curl -v http://bonus.ananasiika.svc.cluster.local:8050/manage/health || echo "Bonus failed"
              
              echo "Testing tickets with full DNS name..."
              curl -v http://tickets.ananasiika.svc.cluster.local:8070/manage/health || echo "Tickets failed"
            '
      
      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: PostgreSQL Check
        if: always()
        run: |
          echo "=== Immediate PostgreSQL Status ==="
          
          # Проверяем все компоненты
          kubectl get all,pvc,configmap -n ananasiika | grep postgres
          
          # Подробные логи
          POD_NAME=$(kubectl get pods -n ananasiika -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$POD_NAME" ]; then
            echo "=== Pod $POD_NAME logs ==="
            kubectl logs -n ananasiika $POD_NAME --tail=100
            
            echo "=== Checking init scripts ==="
            kubectl exec -n ananasiika $POD_NAME -- ls -la /docker-entrypoint-initdb.d/
            
            echo "=== Checking database ==="
            kubectl exec -n ananasiika $POD_NAME -- \
              psql -U postgres -l || echo "Cannot list databases"
          else
            echo "❌ PostgreSQL pod not found"
          fi

      - name: Check Logs
        if: always()
        run: |
          echo "=== Getting logs from ALL services ==="
    
          # Получаем все поды в неймспейсе
          kubectl get pods -n ananasiika -o wide
          
          echo "================================================================================"
          echo "=== LOGS BY SERVICE TYPE ==="
          echo "================================================================================"
          
          SERVICES="gateway flights bonus tickets postgres"
          
          for service in $SERVICES; do
            echo "--- Service: $service ---"
            kubectl logs -n ananasiika -l app="$service" --prefix=true --tail=50 --all-containers=true 2>/dev/null || \
            kubectl logs -n ananasiika -l app.kubernetes.io/name="$service" --prefix=true --tail=50 --all-containers=true 2>/dev/null || \
            echo "No logs found for service: $service"
            echo ""
          done

      - name: Cleanup Tunnel
        if: always()
        run: |
          if [ ! -z "$TUNNEL_PID" ]; then
            kill $TUNNEL_PID 2>/dev/null || true
          fi

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true