name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up k8s
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.16.4'

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "${HOME}/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud and find service account
        env:
          YC_PRIVATE_KEY: ${{ secrets.YC_PRIVATE_KEY }}
        run: |
          # Создаем временный ключевой файл
          echo "$YC_PRIVATE_KEY" > temp-key.pem
          
          # Пробуем разные форматы ключа
          if grep -q "BEGIN PRIVATE KEY" temp-key.pem; then
            echo "✓ Key is in PKCS8 format"
            cp temp-key.pem private-key.pem
          elif grep -q "BEGIN RSA PRIVATE KEY" temp-key.pem; then
            echo "✓ Key is in PKCS1 format" 
            cp temp-key.pem private-key.pem
          else
            echo "✗ Key missing headers, adding PKCS8 format"
            cat > private-key.pem << EOF
              -----BEGIN PRIVATE KEY-----
              $(echo "$YC_PRIVATE_KEY" | sed 's/\\n/\n/g')
              -----END PRIVATE KEY-----
              EOF
                      fi
          
          # Настраиваем YC CLI
          yc config set service-account-key private-key.pem
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          
          # Получаем список сервисных аккаунтов и берем первый
          echo "=== Getting service accounts ==="
          yc iam service-account list
          
          # Сохраняем ID первого сервисного аккаунта
          YC_SERVICE_ACCOUNT_ID=$(yc iam service-account list --format=json | jq -r '.[0].id')
          echo "Using service account ID: $YC_SERVICE_ACCOUNT_ID"
          echo "YC_SERVICE_ACCOUNT_ID=$YC_SERVICE_ACCOUNT_ID" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        env:
          YC_PRIVATE_KEY: ${{ secrets.YC_PRIVATE_KEY }}
        run: |
          # Создаем полный JSON ключ
          cat > sa-key.json << EOF
          {
            "id": "${{ secrets.YC_KEY_ID }}",
            "service_account_id": "$YC_SERVICE_ACCOUNT_ID", 
            "private_key": "$(echo "$YC_PRIVATE_KEY" | sed 's/\\n/\\\\n/g')"
          }
          EOF
          
          # Используем JSON ключ
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          
          # Получаем credentials кластера
          yc managed-kubernetes cluster get-credentials ${{ secrets.YC_CLUSTER_ID }} --external

          # Создаем namespace
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

          # Деплой PostgreSQL
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm upgrade --install postgresql bitnami/postgresql -n test \
            --set auth.postgresPassword=postgres \
            --set auth.database=postgres \
            --set primary.initdb.scripts."init-multiple-dbs\.sql"="$(cat postgres/init-multiple-dbs.sql)"

          # Ждем PostgreSQL
          sleep 30

          # Деплой микросервисов
          helm upgrade --install bonus-service ./k8s/charts/microservice -n test \
            --set name=bonus-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/bonus-service \
            --set image.tag=latest \
            --set service.port=8050 \
            --set database.name=privileges

          helm upgrade --install flight-service ./k8s/charts/microservice -n test \
            --set name=flight-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/flight-service \
            --set image.tag=latest \
            --set service.port=8060 \
            --set database.name=flights

          helm upgrade --install ticket-service ./k8s/charts/microservice -n test \
            --set name=ticket-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/ticket-service \
            --set image.tag=latest \
            --set service.port=8070 \
            --set database.name=tickets

          helm upgrade --install gateway-service ./k8s/charts/microservice -n test \
            --set name=gateway-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/gateway-service \
            --set image.tag=latest \
            --set service.port=8080 \
            --set database.enabled=false

          # Деплой Ingress
          kubectl apply -f k8s/ingress.yaml -n test

          # Проверка
          sleep 30
          kubectl get all -n test

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true