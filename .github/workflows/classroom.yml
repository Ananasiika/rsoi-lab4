name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  deploy:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@master

      - name: Check Minikube Cluster
        run: |
          minikube status
          kubectl get pods -A

      - name: Create Namespace
        run: kubectl create namespace ananasiika 

      - name: Deploy DB and services
        run: |
          kubectl get namespace
          
          cd k8s
          echo "------------------Deploy DB------------------"
          helm delete postgres --namespace ananasiika --ignore-not-found
          helm install -n ananasiika postgres ./postgres
          
          echo "------------------Deploy services------------------"
          helm delete tickets --namespace ananasiika --ignore-not-found
          helm install -n ananasiika tickets ./services

      - name: Install Ingress Controller
        run: |
          # Устанавливаем Ingress Controller
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
          
          # Ждем готовности
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml
      
      - name: Wait 60s
        uses: jakejarvis/wait-action@master
        with:
          time: '60s'

      - name: Check Ingress
        run: |
          kubectl get ingress -n ananasiika
          kubectl get ingress -n ananasiika -o wide
          echo "Ingress установлен. Приложение доступно через внешний IP выше"
          echo "=== Detailed Ingress Debug ==="
    
          # Проверить Ingress Controller
          kubectl get pods -n ingress-nginx
          kubectl get svc -n ingress-nginx -o wide
          
          # Проверить события
          kubectl get events -n ingress-nginx --sort-by=.lastTimestamp
          kubectl get events -n ananasiika --sort-by=.lastTimestamp
          
          # Детали Ingress
          kubectl describe ingress gateway-ingress -n ananasiika
          
          # Проверить логи Ingress Controller
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --tail=50

      - name: All resources from namespace ananasiika
        run: |
          kubectl get all -n ananasiika

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true