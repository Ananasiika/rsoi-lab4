name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          dotnet restore ./src/BonusService/BonusService.csproj
          dotnet restore ./src/FlightService/FlightService.csproj
          dotnet restore ./src/TicketService/TicketService.csproj
          dotnet restore ./src/GatewayService/GatewayService.csproj

      - name: Build
        run: |
          dotnet publish ./src/BonusService/BonusService.csproj -c Release
          dotnet publish ./src/FlightService/FlightService.csproj -c Release
          dotnet publish ./src/TicketService/TicketService.csproj -c Release
          dotnet publish ./src/GatewayService/GatewayService.csproj -c Release

      - name: Run Tests
        run: dotnet test ./src

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "${HOME}/yandex-cloud/bin" >> $GITHUB_PATH
          source ~/.bashrc

      - name: Configure Yandex Cloud
        run: |
          # Создаем конфиг файл для аутентификации
          mkdir -p ~/.config/yandex-cloud
          cat > ~/.config/yandex-cloud/config.yaml << EOF
          current: default
          profiles:
            default:
              service-account-key:
                id: ${{ secrets.YC_KEY_ID }}
                service_account_id: ${{ secrets.YC_KEY_ID }}
                private_key: |
                  $(echo "${{ secrets.YC_PRIVATE_KEY }}" | sed 's/\\n/\n/g')
              folder-id: ${{ secrets.YC_FOLDER_ID }}
          EOF

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Setup Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Get K8s cluster credentials
        run: yc managed-kubernetes cluster get-credentials ${{ secrets.YC_CLUSTER_ID }} --external

      - name: Create namespace if not exists
        run: kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create PostgreSQL ConfigMap
        run: kubectl apply -f k8s/postgres-configmap.yaml -n test

      - name: Deploy PostgreSQL
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install postgresql bitnami/postgresql -n test \
            --set auth.postgresPassword=postgres \
            --set auth.database=postgres \
            --set primary.initdb.scriptsConfigMap=postgres-init-scripts

      - name: Wait for PostgreSQL to be ready
        run: kubectl wait -n test --for=condition=ready pod -l app.kubernetes.io/name=postgresql --timeout=300s

      - name: Deploy applications with Helm
        run: |
          helm upgrade --install bonus-service ./k8s/charts/microservice -n test \
            --set name=bonus-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/bonus-service \
            --set image.tag=latest \
            --set service.port=8050 \
            --set database.name=privileges \
            --set database.host=postgresql-postgresql

          helm upgrade --install flight-service ./k8s/charts/microservice -n test \
            --set name=flight-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/flight-service \
            --set image.tag=latest \
            --set service.port=8060 \
            --set database.name=flights \
            --set database.host=postgresql-postgresql

          helm upgrade --install ticket-service ./k8s/charts/microservice -n test \
            --set name=ticket-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/ticket-service \
            --set image.tag=latest \
            --set service.port=8070 \
            --set database.name=tickets \
            --set database.host=postgresql-postgresql

          helm upgrade --install gateway-service ./k8s/charts/microservice -n test \
            --set name=gateway-service \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/gateway-service \
            --set image.tag=latest \
            --set service.port=8080 \
            --set database.enabled=false

      - name: Deploy Ingress
        run: kubectl apply -f k8s/ingress.yaml -n test

      - name: Wait for services to be ready
        run: |
          # Ждем немного перед проверкой
          sleep 30
          kubectl wait -n test --for=condition=Ready pod -l app=gateway-service --timeout=300s
          kubectl wait -n test --for=condition=Ready pod -l app=bonus-service --timeout=300s
          kubectl wait -n test --for=condition=Ready pod -l app=flight-service --timeout=300s
          kubectl wait -n test --for=condition=Ready pod -l app=ticket-service --timeout=300s

      - name: Check deployment status
        run: |
          echo "=== Pods status ==="
          kubectl get pods -n test
          echo "=== Services ==="
          kubectl get services -n test
          echo "=== Ingress ==="
          kubectl get ingress -n test

  autograding:
    name: AutogradingW
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubernetes tools
        uses: yc-actions/yc-kubernetes-tool-installer@v1

      - name: Authenticate in Yandex Cloud
        uses: yc-actions/yc-cli@v1
        with:
          yc-key-id: ${{ secrets.YC_KEY_ID }}
          yc-private-key: ${{ secrets.YC_PRIVATE_KEY }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}

      - name: Get K8s cluster credentials
        run: yc managed-kubernetes cluster get-credentials ${{ secrets.YC_CLUSTER_ID }} --external

      - name: Run tests
        run: |
          chmod +x ./scripts/test-script.sh
          ./scripts/test-script.sh v1 gateway-service test

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true