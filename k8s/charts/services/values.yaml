name: "microservice"
replicaCount: 2

image:
  repository: "your-username/microservice"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 8080
  type: ClusterIP

database:
  enabled: true
  name: "mydatabase"
  host: "postgresql.postgresql.svc.cluster.local"
  port: 5432
  username: "postgres"
  password: "postgres"

ingress:
  enabled: false
  host: "example.com"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  path: /health
  port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  path: /health
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5