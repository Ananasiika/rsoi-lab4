apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: Services__BonusService
          value: "http://bonus-service:8050"
        - name: Services__FlightService
          value: "http://flight-service:8060"
        - name: Services__TicketService
          value: "http://ticket-service:8070"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
  - port: 8080
    targetPort: 8080